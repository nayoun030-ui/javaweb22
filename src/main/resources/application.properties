spring.application.name=demo

# [4주차] MySQL 연결 (DB 이름 : spring, 포트 : 3306)
spring.datasource.url=jdbc:mysql://localhost:3306/spring?serverTimezone=Asia/Seoul
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# [5주차] 계정 정보(username, password)는 별도 파일로 분리 → GitHub 에 올라가지 않음
spring.config.import=optional:application-secret.properties

# [11주차] 단계 2 : 파일 업로드 크기 (기본값 : 파일 1MB, 요청 전체 10MB) — 무제한(-1) 금지 (DoS)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
# 크기를 넘은 요청의 본문을 Tomcat 이 끝까지 읽어 준다 → 연결이 끊기지 않고 413 화면이 뜬다 (기본 2MB)
server.tomcat.max-swallow-size=20MB
