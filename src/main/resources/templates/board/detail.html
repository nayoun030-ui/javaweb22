<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- |...| 리터럴 치환 안에는 | 문자를 쓸 수 없다 → 문자열 연결(+) 사용 -->
    <title th:text="${post.title} + ' - 게시판'">글 - 게시판</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/bootstrap-icons.css}" rel="stylesheet">
    <link th:href="@{/css/templatemo-first-portfolio-style.css}" rel="stylesheet">
    <link th:href="@{/css/board.css}" rel="stylesheet">
</head>
<body>
    <main class="section-padding">
        <div class="container">
            <div class="row">
                <div class="col-lg-10 col-12 mx-auto">
                    <div class="board-bar">
                        <a th:href="@{/}" class="brand">Nayeon</a>
                        <a th:href="@{/board}">게시판</a>
                        <!-- [11주차] 신청 바구니 + 배지 (세션에 담긴 모집글 수) -->
                        <a sec:authorize="isAuthenticated()" th:href="@{/cart}">신청 바구니 <span class="badge rounded-pill bg-secondary" th:text="${cartCount}">0</span></a>
                        <span class="ms-auto" sec:authorize="isAuthenticated()"><strong sec:authentication="name">student1</strong>님</span>
                        <a class="ms-auto" sec:authorize="isAnonymous()" th:href="@{/login}">로그인</a>
                    </div>

                    <div class="services-thumb"
                         th:with="isWriter=${#authorization.expression('isAuthenticated()') and #authentication.name == post.author.username},
                                  isAdmin=${#authorization.expression('hasRole(''ADMIN'')')}">
                        <div class="border-bottom mb-2 pb-3">
                            <h2 class="mb-3" th:text="${post.title}">제목</h2>
                            <div class="post-meta">
                                <span><i class="bi-person me-1"></i><span th:text="${post.author.name}">작성자</span></span>
                                <span><i class="bi-clock me-1"></i><span th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">작성일</span></span>
                                <span th:if="${post.updatedAt != null}">
                                    수정 <span th:text="${#temporals.format(post.updatedAt, 'yyyy-MM-dd HH:mm')}">수정일</span>
                                </span>
                                <span><i class="bi-eye me-1"></i>조회 <span th:text="${post.viewCount}">0</span></span>
                            </div>
                        </div>

                        <!-- [11주차] 단계 2 : 포스터 (uploads/ 의 UUID 파일 → WebConfig 가 /uploads/** 로 보여 준다) -->
                        <div th:if="${post.posterFile != null}" class="post-poster">
                            <img th:src="@{/uploads/{f}(f=${post.posterFile})}" alt="모집 포스터">
                        </div>

                        <!-- [11주차] 단계 1 : 모집 정보 (정원 · 신청 · 남은 자리 = 계산값) + 진행 막대 + 바구니 담기 -->
                        <div th:if="${post.recruit}" class="recruit-box" th:attr="data-seat-post=${post.id}"
                             th:with="pct=${post.capacity == 0 ? 0 : post.appliedCount * 100 / post.capacity}">
                            <div class="recruit-stats">
                                <div><span>정원</span><strong th:text="${post.capacity}">5</strong></div>
                                <div><span>신청</span><strong data-seat="applied" th:text="${post.appliedCount}">0</strong></div>
                                <div><span>남은 자리</span><strong data-seat="remaining" th:text="${post.remaining}" th:classappend="${post.full} ? 'text-danger'">5</strong></div>
                            </div>
                            <div class="progress mt-3" role="progressbar">
                                <div class="progress-bar" data-seat="bar" th:classappend="${post.full} ? 'bg-danger'"
                                     th:style="|width: ${pct}%|" th:text="|${pct}%|">0%</div>
                            </div>
                            <div class="mt-3 text-end">
                                <span class="text-danger fw-bold" data-seat="fullmsg" th:hidden="${!post.full}">정원이 마감되었습니다</span>
                                <!-- 담기 : POST /cart/{id} (로그인 필요 → 비로그인은 로그인 화면으로) -->
                                <form th:unless="${post.full}" data-seat="form" th:action="@{/cart/{id}(id=${post.id})}" method="post" class="d-inline" data-busy="담는 중…">
                                    <button type="submit" class="custom-btn btn"><i class="bi-basket me-1"></i>바구니 담기</button>
                                </form>
                            </div>
                        </div>

                        <!-- th:text : 글 안의 <script> 도 글자로 출력 (XSS 방지) / pre-wrap : 줄바꿈 유지 -->
                        <div class="post-content" th:text="${post.content}">내용</div>

                        <div class="d-flex align-items-center border-top pt-3">
                            <a th:href="@{/board}" class="custom-btn custom-border-btn btn">목록</a>
                            <div class="post-actions ms-auto">
                                <!-- 버튼은 화면에서 숨길 뿐 → 서버(PostService.checkWriter)가 한 번 더 확인 -->
                                <a th:if="${isWriter}" th:href="@{/board/{id}/edit(id=${post.id})}"
                                   class="custom-btn custom-border-btn btn">수정</a>
                                <form th:if="${isWriter or isAdmin}" th:action="@{/board/{id}/delete(id=${post.id})}" method="post"
                                      onsubmit="return confirm('정말 삭제할까요?');">
                                    <button type="submit" class="custom-btn btn"
                                            th:text="${isWriter} ? '삭제' : '관리자 삭제'">삭제</button>
                                </form>
                            </div>
                        </div>

                        <!-- [10주차] 댓글 영역 : 컨트롤러가 comments 를 넘길 때 나타난다 / #comments = 페이지 안의 위치 -->
                        <section id="comments" class="comments" th:if="${comments != null}">
                            <h5 class="mb-2"><i class="bi-chat-dots me-2"></i>댓글 <span th:text="${comments.size()}">0</span></h5>

                            <div th:if="${param.commentError}" class="alert alert-danger py-2">댓글은 1~500자로 입력하세요.</div>
                            <div th:if="${param.commentDeleted}" class="alert alert-success py-2">댓글이 삭제되었습니다.</div>

                            <!-- 오래된 댓글이 위 (findByPostOrderByIdAsc) -->
                            <div th:each="c : ${comments}" class="comment-item"
                                 th:with="isCommentWriter=${#authorization.expression('isAuthenticated()') and #authentication.name == c.author.username}">
                                <div class="meta">
                                    <strong th:text="${c.author.name}">작성자</strong>
                                    <span th:text="${#temporals.format(c.createdAt, 'yyyy-MM-dd HH:mm')}">시간</span>
                                    <!-- 삭제 : 댓글 본인 또는 관리자 (글 주인이라도 남의 댓글은 삭제 불가) -->
                                    <form th:if="${isCommentWriter or isAdmin}"
                                          th:action="@{/board/{postId}/comments/{id}/delete(postId=${post.id}, id=${c.id})}"
                                          method="post" onsubmit="return confirm('댓글을 삭제할까요?');">
                                        <button type="submit" class="btn btn-sm btn-link text-danger p-0"
                                                th:text="${isCommentWriter} ? '삭제' : '관리자 삭제'">삭제</button>
                                    </form>
                                </div>
                                <div class="body" th:text="${c.content}">댓글 내용</div>
                            </div>
                            <p th:if="${comments.isEmpty()}" class="text-muted my-3">첫 댓글을 남겨 보세요.</p>

                            <!-- 댓글 쓰기 : POST /board/{id}/comments (로그인 필요) -->
                            <form sec:authorize="isAuthenticated()" th:action="@{/board/{id}/comments(id=${post.id})}" data-busy="등록 중…"
                                  method="post" class="comment-form">
                                <textarea name="content" class="form-control" maxlength="500" placeholder="댓글을 입력하세요 (500자까지)"></textarea>
                                <button type="submit" class="custom-btn btn">등록</button>
                            </form>
                            <p sec:authorize="isAnonymous()" class="text-muted mt-3 mb-0">
                                <a th:href="@{/login}">로그인</a>하면 댓글을 쓸 수 있습니다.
                            </p>
                        </section>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <!-- [12주차] 실시간 : 연결 상태 · 종 · 알림 + STOMP 클라이언트 -->
    <div th:replace="~{fragments/realtime :: realtime}"></div>
</body>
</html>
