<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>회원가입 | 김나연</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/bootstrap-icons.css}" rel="stylesheet">
    <link th:href="@{/css/templatemo-first-portfolio-style.css}" rel="stylesheet">
</head>
<body>
    <main class="section-padding d-flex align-items-center" style="min-height: 100vh;">
        <div class="container">
            <div class="row">
                <div class="col-lg-5 col-md-8 col-12 mx-auto">
                    <div class="services-thumb">
                        <div class="d-flex align-items-center border-bottom mb-4 pb-3">
                            <h2 class="mb-0"><i class="bi-person-plus me-2"></i>회원가입</h2>
                            <a th:href="@{/}" class="ms-auto">메인으로</a>
                        </div>

                        <!-- 컨트롤러가 넘긴 오류 메시지 (중복 아이디 등) -->
                        <div th:if="${error}" th:text="${error}" class="alert alert-danger"></div>

                        <!-- name 속성 = MemberForm 필드 이름 → 자동 바인딩 / th:action → _csrf 자동 삽입 -->
                        <form th:action="@{/signup}" method="post" class="custom-form">
                            <div class="form-floating mb-3">
                                <input type="text" name="username" id="username" class="form-control" placeholder="아이디"
                                       th:value="${memberForm?.username}" required>
                                <label for="username">아이디</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="password" name="password" id="password" class="form-control" placeholder="비밀번호" required>
                                <label for="password">비밀번호</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="password" name="passwordConfirm" id="passwordConfirm" class="form-control" placeholder="비밀번호 확인" required>
                                <label for="passwordConfirm">비밀번호 확인</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="text" name="name" id="name" class="form-control" placeholder="이름"
                                       th:value="${memberForm?.name}" required>
                                <label for="name">이름</label>
                            </div>
                            <button type="submit" class="form-control">가입하기</button>
                        </form>

                        <p class="mt-4 mb-0 text-center">이미 회원이신가요? <a th:href="@{/login}">로그인</a></p>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
