<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>413 파일이 너무 큽니다</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/bootstrap-icons.css}" rel="stylesheet">
    <link th:href="@{/css/templatemo-first-portfolio-style.css}" rel="stylesheet">
</head>
<body>
    <main class="section-padding d-flex align-items-center" style="min-height: 100vh;">
        <div class="container">
            <div class="row">
                <div class="col-lg-6 col-md-8 col-12 mx-auto text-center">
                    <div class="services-thumb">
                        <h1 class="mb-2 text-warning"><i class="bi-file-earmark-x me-2"></i>413</h1>
                        <h3 class="mb-3">파일이 너무 큽니다</h3>
                        <!-- [11주차] max-file-size (파일 1개) 또는 max-request-size (요청 전체) 를 넘었을 때 -->
                        <p class="text-muted mb-4">포스터는 한 개에 <strong>5MB</strong>까지 올릴 수 있습니다.<br>사진 크기를 줄여서 다시 시도해 주세요.</p>
                        <a href="javascript:history.back()" class="custom-btn custom-border-btn btn me-2">이전으로</a>
                        <a th:href="@{/board}" class="custom-btn btn">게시판</a>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
