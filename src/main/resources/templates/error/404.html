<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 페이지 없음</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/bootstrap-icons.css}" rel="stylesheet">
    <link th:href="@{/css/templatemo-first-portfolio-style.css}" rel="stylesheet">
</head>
<body>
    <main class="section-padding d-flex align-items-center" style="min-height: 100vh;">
        <div class="container">
            <div class="row">
                <div class="col-lg-6 col-md-8 col-12 mx-auto text-center">
                    <div class="services-thumb">
                        <h1 class="mb-2" style="color: var(--secondary-color);"><i class="bi-question-circle me-2"></i>404</h1>
                        <h3 class="mb-3">찾을 수 없는 페이지입니다</h3>
                        <!-- 없는 글(ResponseStatusException 404) · 없는 주소 모두 이 화면 -->
                        <p class="text-muted mb-4">
                            요청 주소 <code th:text="${path}">/board/99999</code> 에 해당하는 글이나 페이지가 없습니다.
                        </p>
                        <a th:href="@{/board}" class="custom-btn custom-border-btn btn me-2">게시판</a>
                        <a th:href="@{/}" class="custom-btn btn">메인으로</a>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
